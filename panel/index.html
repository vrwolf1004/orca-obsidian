<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian for Orca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="logo" aria-hidden="true">O</div>
      <div>
        <h1>Obsidian</h1>
        <p class="subtitle" data-i18n="subtitle">Pick a vault, then browse its notes</p>
        <p id="obsidian-status" class="obs-status" hidden></p>
      </div>
    </header>

    <div class="stage">
      <div class="graph-bg">
        <svg id="graph" class="graph" viewBox="0 0 320 320" role="img" aria-label="Note graph"></svg>
      </div>

    <div class="binder collapsed">
      <nav class="binder-tabs" role="tablist" aria-label="Sections">
        <button type="button" role="tab" class="binder-tab" data-tab="vaults" aria-selected="true">VAULTS</button>
        <button type="button" role="tab" class="binder-tab" data-tab="search" aria-selected="false">SEARCH</button>
        <button type="button" role="tab" class="binder-tab" data-tab="notes" aria-selected="false">NOTES</button>
      </nav>

      <div class="binder-body">
        <section id="tab-vaults" class="pane vaults-pane" role="tabpanel">
          <ul id="vault-list" class="vault-list"></ul>
          <button id="pick-folder" type="button" class="pick-folder" data-i18n="pick_folder">Pick a folder…</button>
        </section>

        <section id="tab-search" class="notes-tab" role="tabpanel" hidden>
          <section class="pane search-pane" aria-labelledby="search-title">
            <h2 id="search-title" class="pane-title">Search</h2>
              <input id="search-input" type="search" class="search-input" autocomplete="off" data-i18n-placeholder="search_placeholder" data-i18n-aria="search_placeholder" placeholder="Search notes..." aria-label="Search notes...">
              <ul id="search-results" class="tree"></ul>
            </section>
        </section>

        <section id="tab-notes" class="notes-tab" role="tabpanel" hidden>
          <section id="notes" class="pane notes-pane" hidden>
            <h2 id="notes-title" class="pane-title">Notes</h2>
            <p id="notes-path" class="notes-path"></p>
            <ul id="tree" class="tree"></ul>
          </section>
        </section>
      </div>
    </div>
    </div>

    <section id="viewer" class="pane details-pane" aria-labelledby="details-title" hidden>
      <div class="details-head">
        <h2 id="details-title" class="pane-title">MD</h2>
        <button id="viewer-edit" type="button" class="viewer-edit" data-i18n-title="edit_note" data-i18n-aria="edit_note" title="Edit in Orca" aria-label="Edit in Orca"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button>
      </div>
      <p id="viewer-title" class="viewer-title"></p>
      <article id="viewer-body" class="viewer-body"></article>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>
  <div id="ctx" class="ctx" role="menu" hidden>
    <button type="button" role="menuitem" data-kind="folder" data-i18n="new_folder">New folder</button>
    <button type="button" role="menuitem" data-kind="note" data-i18n="new_note">New note (.md)</button>
  </div>
  <div id="help" class="help" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
    <div class="help-card">
      <div class="help-head">
        <h2 id="help-title" class="help-title" data-i18n="help_title">Help</h2>
        <button id="help-close" type="button" class="viewer-close" data-i18n-title="close" data-i18n-aria="close" title="Close" aria-label="Close">×</button>
      </div>
      <ul class="help-list">
        <li data-i18n="help_vault"></li>
        <li data-i18n="help_notes"></li>
        <li data-i18n="help_context"></li>
      </ul>
      <p class="help-keys" data-i18n="help_keys"></p>
    </div>
  </div>
  <script type="module" src="../src/panel.ts"></script>
</body>
</html>
